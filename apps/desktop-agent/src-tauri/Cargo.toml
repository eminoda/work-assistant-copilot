[package]
name = "workcopilot-desktop"
version = "0.1.0"
description = "WorkCopilot desktop host"
authors = ["WorkCopilot"]
edition = "2021"

[lib]
name = "workcopilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
